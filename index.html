<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login & Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { 
    box-sizing: border-box; 
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Animated background shapes */
  body::before {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    top: -250px;
    left: -250px;
    animation: float 20s infinite ease-in-out;
  }

  body::after {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 50%;
    bottom: -200px;
    right: -200px;
    animation: float 25s infinite ease-in-out reverse;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(50px, -50px) rotate(120deg); }
    66% { transform: translate(-30px, 40px) rotate(240deg); }
  }

  .container {
    background: #fff;
    width: 100%;
    max-width: 420px;
    border-radius: 24px;
    padding: 40px 35px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    position: relative;
    z-index: 1;
    animation: slideUp 0.6s ease-out;
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
    font-size: 28px;
    font-weight: 700;
    animation: fadeIn 0.8s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .tabs {
    display: flex;
    background: #f5f5f5;
    border-radius: 30px;
    margin-bottom: 30px;
    padding: 5px;
    position: relative;
  }

  .tab {
    flex: 1;
    padding: 12px;
    border-radius: 25px;
    text-align: center;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    color: #666;
    position: relative;
    z-index: 1;
  }

  .tab.active {
    background: linear-gradient(135deg, #555 0%, #777 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(85, 85, 85, 0.4);
    transform: scale(1.02);
  }

  .input-group {
    margin-bottom: 20px;
    animation: slideIn 0.5s ease-out backwards;
  }

  .input-group:nth-child(1) { animation-delay: 0.1s; }
  .input-group:nth-child(2) { animation-delay: 0.2s; }
  .input-group:nth-child(3) { animation-delay: 0.3s; }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(-20px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 12px;
    border: 2px solid #e0e0e0;
    font-size: 15px;
    transition: all 0.3s ease;
    background: #fafafa;
  }

  input:focus {
    outline: none;
    border-color: #777;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(119, 119, 119, 0.1);
    transform: translateY(-2px);
  }

  input::placeholder {
    color: #aaa;
  }

  .forgot {
    font-size: 14px;
    color: #777;
    cursor: pointer;
    margin-bottom: 20px;
    text-align: right;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  .forgot:hover {
    color: #555;
    text-decoration: underline;
  }

  button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #555 0%, #777 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(85, 85, 85, 0.4);
    animation: slideIn 0.5s ease-out 0.4s backwards;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(85, 85, 85, 0.5);
  }

  button:active {
    transform: translateY(0);
  }

  /* Modal Styles */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.3s ease-out;
  }

  .modal.show {
    display: flex;
  }

  .modal-box {
    background: #fff;
    padding: 35px;
    width: 90%;
    max-width: 400px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    animation: modalSlide 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  @keyframes modalSlide {
    from {
      opacity: 0;
      transform: scale(0.8) translateY(-50px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .modal-box h3 {
    margin-bottom: 20px;
    color: #333;
    font-size: 24px;
  }

  .modal-box input {
    margin-bottom: 20px;
  }

  .modal-box button {
    margin-bottom: 10px;
  }

  .modal-box button:last-child {
    background: #6c757d;
    box-shadow: 0 4px 15px rgba(108, 117, 125, 0.4);
  }

  .modal-box button:last-child:hover {
    background: #5a6268;
  }

  /* Form transition */
  .form-content {
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  .form-content.switching {
    opacity: 0;
    transform: scale(0.95);
  }

  /* Responsive */
  @media (max-width: 480px) {
    .container {
      padding: 30px 25px;
    }

    h2 {
      font-size: 24px;
    }
  }
</style>
</head>

<body>

<div class="container">
  <h2 id="title">Login Form</h2>

  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div>
    <div class="tab" id="signupTab" onclick="switchTab('signup')">Signup</div>
  </div>

  <div class="form-content" id="formContent">
    <div class="input-group">
      <input type="email" id="email" placeholder="Email Address">
    </div>

    <div class="input-group">
      <input type="password" id="password" placeholder="Password">
    </div>

    <div class="input-group" id="confirmPasswordGroup" style="display:none">
      <input type="password" id="confirmPassword" placeholder="Confirm Password">
    </div>

    <div class="forgot" id="forgotLink" onclick="openForgot()">Forgot password?</div>

    <button onclick="submitForm()" id="actionBtn">Login</button>
  </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal" id="forgotModal">
  <div class="modal-box">
    <h3>Reset Password</h3>
    <input type="email" id="resetEmail" placeholder="Enter your email">
    <button onclick="sendReset()">Send Reset Link</button>
    <button onclick="closeForgot()">Close</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  // Initialize mode variable first
  let mode = "login";

  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyA1oZqMFBC3nJ0Nkao-Dy4Tdw93pqrBIbk",
    authDomain: "zeroz-9181e.firebaseapp.com",
    projectId: "zeroz-9181e",
    appId: "1:405987257611:web:914e216283ec8c6055860e"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function switchTab(type) {
    // Add switching animation
    const formContent = document.getElementById('formContent');
    formContent.classList.add('switching');

    setTimeout(() => {
      mode = type;
      document.getElementById("loginTab").classList.toggle("active", type === "login");
      document.getElementById("signupTab").classList.toggle("active", type === "signup");
      document.getElementById("confirmPasswordGroup").style.display = type === "signup" ? "block" : "none";
      document.getElementById("forgotLink").style.display = type === "login" ? "block" : "none";
      document.getElementById("title").innerText = type === "login" ? "Login Form" : "Signup Form";
      document.getElementById("actionBtn").innerText = type === "login" ? "Login" : "Signup";
      
      formContent.classList.remove('switching');
    }, 200);
  }

  function submitForm() {
    const emailValue = document.getElementById("email").value.trim();
    const passwordValue = document.getElementById("password").value;

    if (!emailValue || !passwordValue) {
      alert("⚠️ Please fill all fields");
      return;
    }

    if (mode === "login") {
      auth.signInWithEmailAndPassword(emailValue, passwordValue)
        .then(() => {
          alert("✅ Login successful!");
          // Redirect or perform action after successful login
        })
        .catch(err => {
          alert("❌ " + err.message);
        });
    } else {
      const confirmValue = document.getElementById("confirmPassword").value;

      if (passwordValue !== confirmValue) {
        alert("❌ Passwords do not match");
        return;
      }

      if (passwordValue.length < 6) {
        alert("❌ Password should be at least 6 characters");
        return;
      }

      auth.createUserWithEmailAndPassword(emailValue, passwordValue)
        .then(() => {
          alert("✅ Signup successful!");
          // Redirect or perform action after successful signup
        })
        .catch(err => {
          alert("❌ " + err.message);
        });
    }
  }

  function openForgot() {
    document.getElementById("forgotModal").classList.add('show');
  }

  function closeForgot() {
    document.getElementById("forgotModal").classList.remove('show');
  }

  function sendReset() {
    const resetEmail = document.getElementById("resetEmail").value.trim();

    if (!resetEmail) {
      alert("⚠️ Please enter your email address");
      return;
    }

    auth.sendPasswordResetEmail(resetEmail)
      .then(() => {
        alert("✅ Password reset link sent to your email!");
        closeForgot();
        document.getElementById("resetEmail").value = "";
      })
      .catch(err => {
        alert("❌ " + err.message);
      });
  }

  // Close modal on outside click
  document.getElementById("forgotModal").addEventListener('click', function(e) {
    if (e.target === this) {
      closeForgot();
    }
  });

  // Allow Enter key to submit
  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      if (document.getElementById("forgotModal").classList.contains('show')) {
        sendReset();
      } else {
        submitForm();
      }
    }
  });
</script>

</body>
</html>
