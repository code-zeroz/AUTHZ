<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login & Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }

  body {
    background: linear-gradient(to bottom, #000 40%, #9fa2e6 40%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    background: #fff;
    width: 360px;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .tabs {
    display: flex;
    background: #f1f1f1;
    border-radius: 25px;
    margin-bottom: 20px;
  }

  .tab {
    flex: 1;
    padding: 10px;
    border-radius: 25px;
    text-align: center;
    cursor: pointer;
    font-weight: 600;
  }

  .tab.active {
    background: linear-gradient(to right, #0052a5, #007bff);
    color: white;
  }

  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
  }

  .forgot {
    font-size: 14px;
    color: #007bff;
    cursor: pointer;
    margin-bottom: 15px;
  }

  button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(to right, #0052a5, #007bff);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
  }

  .modal-box {
    background: #fff;
    padding: 25px;
    width: 300px;
    border-radius: 12px;
    text-align: center;
  }
</style>
</head>

<body>

<div class="container">
  <h2 id="title">Login Form</h2>

  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div>
    <div class="tab" id="signupTab" onclick="switchTab('signup')">Signup</div>
  </div>

  <input type="email" id="email" placeholder="Email Address">
  <input type="password" id="password" placeholder="Password">

  <input type="password" id="confirmPassword" placeholder="Confirm Password" style="display:none">

  <div class="forgot" id="forgotLink" onclick="openForgot()">Forgot password?</div>

  <button onclick="submitForm()" id="actionBtn">Login</button>
</div>

<!-- Forgot Password Modal -->
<div class="modal" id="forgotModal">
  <div class="modal-box">
    <h3>Reset Password</h3>
    <input type="email" id="resetEmail" placeholder="Enter email">
    <button onclick="sendReset()">Send Link</button>
    <br><br>
    <button onclick="closeForgot()">Close</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  // 🔴 ADD YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyA1oZqMFBC3nJ0Nkao-Dy4Tdw93pqrBIbk",
    authDomain: "zeroz-9181e.firebaseapp.com",
    projectId: "zeroz-9181e",
    appId: "1:405987257611:web:914e216283ec8c6055860e"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  let mode = "login";

  function switchTab(type) {
    mode = type;
    document.getElementById("loginTab").classList.toggle("active", type === "login");
    document.getElementById("signupTab").classList.toggle("active", type === "signup");
    document.getElementById("confirmPassword").style.display = type === "signup" ? "block" : "none";
    document.getElementById("forgotLink").style.display = type === "login" ? "block" : "none";
    document.getElementById("title").innerText = type === "login" ? "Login Form" : "Signup Form";
    document.getElementById("actionBtn").innerText = type === "login" ? "Login" : "Signup";
  }

  
  function submitForm() {
    const emailValue = document.getElementById("email").value;
    const passwordValue = document.getElementById("password").value;

    if (!emailValue || !passwordValue) {
      alert("⚠️ Please fill all fields");
      return;
    }

    if (mode === "login") {
      auth.signInWithEmailAndPassword(emailValue, passwordValue)
        .then(() => {
          alert("✅ Login successful!");
        })
        .catch(err => {
          alert("❌ " + err.message);
        });
    } else {
      const confirmValue = document.getElementById("confirmPassword").value;

      if (passwordValue !== confirmValue) {
        alert("❌ Passwords do not match");
        return;
      }

      auth.createUserWithEmailAndPassword(emailValue, passwordValue)
        .then(() => {
          alert("✅ Signup successful!");
        })
        .catch(err => {
          alert("❌ " + err.message);
        });
    }
  }
</script>


</body>
</html>
